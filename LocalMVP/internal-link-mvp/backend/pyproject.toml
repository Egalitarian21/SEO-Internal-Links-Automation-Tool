[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-link-mvp-backend"
version = "0.1.0"
description = "SEO 内链 MVP 的 FastAPI 后端。"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pytest>=8.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
